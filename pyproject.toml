[tool.poetry]
name = "python-template"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10.0,<3.13"
playwright = "1.40.0"
langchain-ollama = "^0.2.3"
python-dotenv = "^1.0.1"
gradio = "^5.16.0"

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
# Scope to new, well-typed modules; the rest of the codebase pre-dates this.
include = [
    "src/utils/exceptions.py",
    "src/utils/retry.py",
    "src/utils/tokens.py",
    "src/utils/logging_config.py",
    "src/utils/default_config_settings.py",
    "tests",
]
exclude = [".cache", "examples"]
# tiktoken is optional; tests skip if not installed.
reportMissingImports = "warning"

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
line-length = 120
exclude = ['examples']

[tool.ruff.lint]
# Focus on syntax errors and critical issues; skip aggressive style rules
# since the codebase pre-dates this lint config.
select = ['E', 'W', 'F', 'I']
ignore = [
    'W291', 'W292', 'W293',  # whitespace
    'E501',                    # line length (handled by line-length)
    'E402',                    # load_dotenv() pattern throughout codebase
    'E741',                    # ambiguous var name
    'F401',                    # unused imports (many in __init__.py and modules)
    'F821',                    # pre-existing undefined forward-ref in custom_agent.py
    'F841',                    # pre-existing unused vars in third-party-style code
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
